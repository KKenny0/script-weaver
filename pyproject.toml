[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "script-weaver"
version = "0.1.0"
description = "Agent-native screenplay and storyboard generation system that grows with you"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kenny Wu"},
]
keywords = ["screenplay", "storyboard", "agent", "llm", "ai", "video-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "rich>=13.0",
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mcp[cli]>=2,<3",
]

[project.scripts]
script-weaver = "script_weaver.cli:main"
script-weaverd = "script_weaver.daemon.server:main"
script-weaver-mcp = "script_weaver.mcp.workbench_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"script_weaver.infrastructure" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "src/script_weaver/agents",
    "src/script_weaver/core",
    "src/script_weaver/exporters",
    "src/script_weaver/llm",
    "src/script_weaver/memory",
    "src/script_weaver/prompts",
    "src/script_weaver/skills",
    "src/script_weaver/tools",
    "src/script_weaver/cli.py",
    "tests/unit",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
