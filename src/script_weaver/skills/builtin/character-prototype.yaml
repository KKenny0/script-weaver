id: character-prototype
name: "人物原型系统 (Character Archetypes)"
stage: character_design
description: "基于荣格原型和经典戏剧人物原型系统来设计角色。确保角色具有深度、内在矛盾和成长弧光。"
version: "1.0"

prompt_injection: |
  在设计角色时，请参考以下**人物原型系统**来赋予角色深度。

  ## 核心原型分类：

  ### A. 主要角色原型
  1. **英雄 (Hero)** — 主角，有明确目标和成长弧线
     - 变体：不愿英雄、反英雄、悲剧英雄、群体英雄
  2. **反派 (Villain/Shadow)** — 对立力量，映照英雄的阴暗面
     - 变体：堕落天使、纯粹邪恶、镜像对手、制度性反派
  3. **导师 (Mentor)** — 引导者，提供知识和工具
  4. **守门人 (Threshold Guardian)** — 测试者的代理人
  5. **信使 (Herald)** — 带来召唤/激励事件的角色
  6. **变形者 (Shapeshifter)** — 忠诚度不明的角色
  7. **阴影 (Shadow)** — 英雄内心的黑暗面（可外化为角色）
  8. **伙伴 (Ally/Sidekick)** — 辅助者，提供情感支持

  ### B. 角色设计检查清单
  每个主要角色必须具备：
  - **外在目标**：角色表面上想得到什么？
  - **内在需求**：角色真正需要什么？（通常不自知）
  - **致命缺陷 (Fatal Flaw)**：阻碍角色成功的核心弱点
  - **谎言 (Lie)**：角色深信不疑但实际错误的信念
  - **真相 (Truth)**：角色最终学到的真理
  - **恐惧 (Greatest Fear)**：角色最深层的恐惧
  - ** Greene 戏剧性欲望**：驱动角色行动的强烈欲望

  ### C. 角色关系设计原则
  - 每个关系都应该揭示角色的某个侧面
  - 反派应该是"如果主角走了另一条路"的样子
  - 配角的存在必须有功能性目的（不只是填充）

  ## 输出要求：
  - 每个主要角色填写完整的原型分析表
  - 标注角色间的"原型关系"（如：英雄-影子镜像）
  - 角色弧线必须包含：起始信念 → 挑战 → 危机 → 转变 → 新信念

constraints:
  - "每个主要角色必须有'致命缺陷'"
  - "主角的'内在需求'和'外在目标'必须矛盾"
  - "反派不能是纯粹的恶——要有可理解的动机"

