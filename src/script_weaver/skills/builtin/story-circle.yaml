id: story-circle
name: "Dan Harmon 故事圈 (Story Circle)"
stage: structuring
description: "基于 Dan Harmon 的 8 段式故事圈结构。适用于喜剧、冒险、成长类叙事。强调角色的循环回归与内在变化。"
version: "1.0"

prompt_injection: |
  你必须遵循「Dan Harmon 故事圈 (Story Circle)」8 段式结构来构建大纲。

  ## 8 个阶段（圆形循环）：

  1. **你 (You)** — 角色处于舒适区/日常状态
  2. **需要 (Need)** — 但某物缺失，角色有潜在的不满足感
  3. **去 (Go)** — 进入陌生环境/跨越门槛
  4. **搜索 (Search)** — 适应新世界，尝试不同方法
  5. **找到 (Find)** — 得到想要的东西（但可能不是真正需要的）
  6. **拿走 (Take)** — 付出沉重代价，承担后果
  7. **返回 (Return)** — 回到起点/熟悉的世界
  8. **改变 (Changed)** — 已经不同了——内在成长完成

  ## 核心原则：
  - 圆形结构：终点呼应起点但已变质
  - "找到"的东西 ≠ "真正需要的"东西（这是关键反转）
  - 第3阶段"去"和第7阶段"返回"形成对称
  - 强调内在变化而非外在事件

  ## 输出要求：
  - 每个阶段100-200字描述
  - 明确标注"表面目标"vs"深层需求"
  - 第5阶段要设置误导性成功
  - 最终阶段必须展示具体的内在变化证据

constraints:
  - "第5阶段必须是误导性的——角色以为成功了但其实没有"
  - "第8阶段必须展示可观察的行为变化"
  - "每个阶段都要回答：角色此时相信什么？"

examples:
  - input: "一个胆小的女孩决定学习武术保护家人"
    output: |
      1. 你：女孩在家中被欺负，习惯忍让
      2. 需要：她渴望力量但害怕冲突
      3. 去：她偷偷报名了武馆
      4. 搜索：训练中屡败屡战，尝试不同流派
      5. 找到：赢得了第一场比赛（但她用的是愤怒而非技巧）
      6. 拿走：她的暴力倾向伤害了最亲近的人
      7. 返回：回到家中面对真正的威胁
      8. 改变：她用智慧+克制化解危机，不再用拳头说话
