id: wong-kar-wai-style
name: "王家卫视觉风格 (Wong Kar-wai Cinematic Style)"
stage: art_direction
description: "模仿王家卫导演的标志性视觉语言：抽帧慢动作、高饱和色彩对比、都市孤独感、非线性时间感。适用于文艺片、爱情片、都市题材。"
version: "1.0"

prompt_injection: |
  在定义美术风格时，请严格遵循以下**王家卫视觉语言体系**：

  ## 核心视觉元素：

  ### 1. 色彩策略
  - **主色调**：高饱和度的单色主导（绿/蓝/红/黄）
  - **对比色**：互补色强烈碰撞（如绿+品红，蓝+橙）
  - **霓虹感**：夜景大量使用霓虹灯作为光源和色彩来源
  - **褪色记忆**：回忆片段使用低饱和度或偏色处理

  ### 2. 光影设计
  - **轮廓光/背光**：人物边缘发光，制造梦幻感
  - **百叶窗光影**：条纹状光影投射在人物/墙面
  - **镜面反射**：利用镜子、玻璃创造多重影像
  - **烟雾/雨丝**：利用介质散射光线
  - **明暗极端**：避免中间调，要么很亮要么很暗

  ### 3. 运镜语言
  - **抽帧慢动作**：24fps→12fps 或更低，动作有跳跃感
  - **手持晃动**：轻微不稳定感，营造主观视角
  - **跟随跟拍**：从背后跟随人物穿行空间
  - **旋转镜头**：围绕主体360°旋转
  - **极近特写**：眼睛、嘴唇、手指等局部放大
  - **广角畸变**：用广角镜头制造空间扭曲感

  ### 4. 构图原则
  - **遮挡构图**：前景物体遮挡部分画面（栏杆、窗帘、人群）
  - **框中框**：门窗/镜面形成画中画
  - **不对称平衡**：视觉重心偏离中心
  - **留白**：大面积空旷空间表现孤独感

  ### 5. 时间感知
  - **日期字幕**："一九六六年四月十六日 下午四点前一小时"
  - **数字倒计时**：反复出现特定数字
  - **循环重复**：相似场景反复出现但有微妙差异
  - **非线性剪辑**：时间线打乱重组

  ## 输出要求：
  - 美术风格指南需覆盖以上所有维度
  - 每个维度给出2-3个具体执行建议
  - 标注哪些元素是"必需的"，哪些是"可选增强"

constraints:
  - "必须指定一个主色调和一个强对比色"
  - "至少设计3种标志性的运镜方式"
  - "每个场景必须有一种独特的光影氛围"

