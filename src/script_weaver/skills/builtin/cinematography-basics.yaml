id: cinematography-basics
name: "基础运镜语言库 (Cinematography Basics)"
stage: storyboarding
description: "标准电影分镜运镜语言参考库。为每个镜头提供专业的机位运动、景别组合和转场建议。确保分镜脚本符合专业影视制作规范。"
version: "1.0"

prompt_injection: |
  在拆解分镜时，请严格使用以下**专业影视分镜语言**：

  ## 景别选择指南：

  | 景别 | 用途 | 情绪效果 | 典型时长 |
  |------|------|----------|----------|
  | 大远景(ELS) | 建立环境、展示规模 | 渺小/壮阔 | 3-5s |
  | 远景(LS) | 人物全身+环境 | 孤立/自由 | 2-4s |
  | 全景(FS) | 人物全身+动作 | 客观/完整 | 2-3s |
  | 中远景(MLS) | 膝盖以上 | 社交距离 | 2-3s |
  | 中景(MS) | 腰部以上 | 对话/互动 | 3-5s |
  | 中近景(MCU) | 胸部以上 | 亲密/紧张 | 3-5s |
  | 特写(CU) | 头部/物件 | 强烈情感 | 2-4s |
  | 大特写(ECU) | 眼睛/细节 | 极致聚焦 | 1-2s |

  ## 运动设计原则：

  ### 推进类（靠近主体）
  - **推镜头 (Push-in)**：缓慢靠近 = 关注/压迫；快速推进 = 冲击/惊吓
  - **变焦推 (Zoom-in)**：保持位置不变的心理靠近

  ### 后退类（远离主体）
  - **拉镜头 (Pull-out)**：揭示更多环境 = 揭示/孤立
  - **变焦拉 (Zoom-out)**：心理疏远

  ### 平移类
  - **横摇 (Pan)**：跟随水平运动 / 扫描环境
  - **纵摇 (Tilt)**：上下扫描 / 力量对比
  - **摇摄组合**：先摇后推 = 发现+关注

  ### 移动类
  - **跟拍 (Tracking/Dolly)**：伴随角色移动 = 参与/沉浸
  - **弧形运动 (Arc)**：围绕主体旋转 = 审视/暴露
  - **升降 (Crane)**：垂直运动 = 权力/神性

  ## 转场逻辑：

  | 转场类型 | 含义 | 使用场景 |
  |----------|------|----------|
  | 切割 (Cut) | 直接跳转 | 最常用，90%+的场景 |
  | 溶化 (Dissolve) | 时间流逝/柔和过渡 | 回忆、梦境、时间跳跃 |
  | 淡入/淡出 (Fade) | 开始/结束 | 场景首尾 |
  | 匹配切 (Match Cut) | 形状/动作匹配 | 创意连接两个场景 |
  | 跳切 (Jump Cut) | 时间压缩 | 加速节奏、表现焦虑 |
  | 冲撞切 (Smash Cut) | 强烈对比 | 惊吓/喜剧节奏 |

  ## 分镜输出规范：
  - 每个镜头必须包含：景别、角度、运动、时长、内容描述
  - 同一场景内景别要有变化（不要全是中景）
  - 运动要有目的（为什么这个镜头要动？）
  - 时长总和应与剧本场景时长大致吻合

constraints:
  - "同一场景内至少要有3种不同的景别"
  - "每个运动镜头必须说明运动的理由"
  - "对话场景注意180度轴线规则"
  - "动作场景适当增加镜头数量以增强节奏"

examples: []
